<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SQST ✦ Обои — серо-золотой контраст</title>
    <style>
        /* ========== СБРОС ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 1920px;
            height: 1080px;
            overflow: hidden;
            background: #f5e6bc;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Georgia', serif;
            position: relative;
        }

        /* ========== ГРАДИЕНТНЫЕ ПЯТНА (яркие, контрастные) ========== */
        .gradient-layer {
            position: absolute;
            inset: 0;
            z-index: 0;
            pointer-events: none;
        }

        .gradient-layer .g1 {
            position: absolute;
            top: -15%;
            left: -10%;
            width: 70%;
            height: 70%;
            background: radial-gradient(ellipse at 30% 40%, #ceaa73 0%, #be9864 35%, #ab7840 65%, transparent 85%);
            opacity: 0.9;
            border-radius: 50%;
            filter: blur(100px);
        }

        .gradient-layer .g2 {
            position: absolute;
            bottom: -10%;
            right: -5%;
            width: 65%;
            height: 65%;
            background: radial-gradient(ellipse at 70% 60%, #804a23 0%, #9b8464 40%, #c5af91 70%, transparent 90%);
            opacity: 0.8;
            border-radius: 50%;
            filter: blur(120px);
        }

        .gradient-layer .g3 {
            position: absolute;
            top: 25%;
            right: 15%;
            width: 45%;
            height: 45%;
            background: radial-gradient(ellipse at 50% 50%, #be9864 0%, #ab7840 50%, transparent 80%);
            opacity: 0.6;
            border-radius: 50%;
            filter: blur(140px);
        }

        .gradient-layer .g4 {
            position: absolute;
            bottom: 25%;
            left: 5%;
            width: 35%;
            height: 35%;
            background: radial-gradient(ellipse at 30% 60%, #1f140e 0%, #9b8464 50%, transparent 80%);
            opacity: 0.5;
            border-radius: 50%;
            filter: blur(120px);
        }

        .gradient-layer .g5 {
            position: absolute;
            top: 5%;
            right: 30%;
            width: 30%;
            height: 30%;
            background: radial-gradient(ellipse at 50% 50%, #c5af91 0%, #ceaa73 50%, transparent 80%);
            opacity: 0.4;
            border-radius: 50%;
            filter: blur(100px);
        }

        /* ========== ХАОТИЧНЫЕ ЛИНИИ (толстые, яркие) ========== */
        .chaos-lines {
            position: absolute;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            opacity: 0.8;
        }

        .chaos-lines svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* ========== НЕОНОВОЕ СВЕЧЕНИЕ ========== */
        .neon-glow {
            position: absolute;
            bottom: 80px;
            right: 100px;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(206, 170, 115, 0.4) 0%, rgba(190, 152, 100, 0.2) 30%, transparent 70%);
            z-index: 1;
            pointer-events: none;
            filter: blur(60px);
            animation: glowPulse 3.5s ease-in-out infinite alternate;
        }

        @keyframes glowPulse {
            0% {
                transform: scale(1);
                opacity: 0.5;
            }
            100% {
                transform: scale(1.4);
                opacity: 1;
            }
        }

        /* ========== СИМВОЛ И ТЕКСТ ========== */
        .signature {
            position: absolute;
            bottom: 50px;
            right: 60px;
            z-index: 3;
            display: flex;
            align-items: center;
            gap: 12px;
            font-family: 'Georgia', serif;
        }

        .symbol {
            font-size: 120px;
            color: #ceaa73;
            text-shadow:
                0 0 40px rgba(206, 170, 115, 0.8),
                0 0 80px rgba(206, 170, 115, 0.4),
                0 0 120px rgba(206, 170, 115, 0.2),
                0 0 200px rgba(190, 152, 100, 0.1),
                0 0 300px rgba(171, 120, 64, 0.05);
            animation: neonPulse 2.8s ease-in-out infinite;
            font-weight: 400;
            letter-spacing: 2px;
            line-height: 1;
        }

        .text {
            font-size: 20px;
            letter-spacing: 8px;
            color: #ceaa73;
            opacity: 0.4;
            font-weight: 300;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        @keyframes neonPulse {
            0%, 100% {
                text-shadow:
                    0 0 40px rgba(206, 170, 115, 0.8),
                    0 0 80px rgba(206, 170, 115, 0.4),
                    0 0 120px rgba(206, 170, 115, 0.2);
                transform: scale(1);
            }
            50% {
                text-shadow:
                    0 0 60px rgba(206, 170, 115, 1),
                    0 0 120px rgba(206, 170, 115, 0.6),
                    0 0 180px rgba(206, 170, 115, 0.3),
                    0 0 300px rgba(190, 152, 100, 0.15),
                    0 0 400px rgba(171, 120, 64, 0.08);
                transform: scale(1.02);
            }
        }

        /* ========== ФУТЕР ========== */
        .footer {
            position: absolute;
            bottom: 20px;
            left: 40px;
            z-index: 2;
            font-family: 'Georgia', serif;
            font-size: 10px;
            letter-spacing: 4px;
            color: rgba(160, 152, 136, 0.1);
            pointer-events: none;
            text-transform: uppercase;
        }

        /* ========== АДАПТАЦИЯ ========== */
        @media (max-width: 1920px) {
            body {
                width: 100vw;
                height: 100vh;
            }
        }

        @media (max-width: 768px) {
            .symbol {
                font-size: 60px;
            }
            .text {
                font-size: 12px;
                letter-spacing: 4px;
            }
            .signature {
                bottom: 30px;
                right: 30px;
            }
            .neon-glow {
                width: 200px;
                height: 200px;
                bottom: 40px;
                right: 50px;
            }
            .gradient-layer .g1,
            .gradient-layer .g2,
            .gradient-layer .g3,
            .gradient-layer .g4,
            .gradient-layer .g5 {
                filter: blur(60px);
            }
        }
    </style>
</head>
<body>

    <!-- ===== ГРАДИЕНТЫ ===== -->
    <div class="gradient-layer">
        <div class="g1"></div>
        <div class="g2"></div>
        <div class="g3"></div>
        <div class="g4"></div>
        <div class="g5"></div>
    </div>

    <!-- ===== ХАОТИЧНЫЕ ЛИНИИ (толстые, яркие) ===== -->
    <div class="chaos-lines">
        <svg viewBox="0 0 1920 1080" preserveAspectRatio="none">
            <!-- Линия 1 — толстая волна -->
            <path d="
                M -50 200
                C 200 80, 400 320, 600 160
                C 800 0, 1000 280, 1200 140
                C 1400 0, 1600 260, 1970 100
            " stroke="#ceaa73" stroke-width="3" fill="none" opacity="0.5" />

            <!-- Линия 2 — хаотичная, толстая -->
            <path d="
                M -50 450
                C 150 380, 350 550, 550 420
                C 750 290, 950 520, 1150 380
                C 1350 240, 1550 500, 1970 350
            " stroke="#be9864" stroke-width="2.5" fill="none" opacity="0.4" />

            <!-- Линия 3 — почти прямая с изгибом -->
            <path d="
                M -50 650
                C 300 620, 500 700, 700 630
                C 900 560, 1100 720, 1300 620
                C 1500 520, 1700 700, 1970 600
            " stroke="#ab7840" stroke-width="3" fill="none" opacity="0.35" />

            <!-- Линия 4 — короткая хаотичная -->
            <path d="
                M 150 850
                C 400 810, 550 920, 750 820
                C 950 720, 1150 900, 1350 810
            " stroke="#ceaa73" stroke-width="2" fill="none" opacity="0.3" />

            <!-- Линия 5 — вертикальная дуга -->
            <path d="
                M 80 1080
                C 110 780, 180 560, 150 340
                C 120 120, 200 20, 170 -50
            " stroke="#be9864" stroke-width="2.5" fill="none" opacity="0.3" />

            <!-- Линия 6 — диагональная -->
            <path d="
                M -50 950
                C 400 890, 800 1000, 1200 920
                C 1600 840, 1800 980, 1970 900
            " stroke="#ab7840" stroke-width="2" fill="none" opacity="0.25" />
        </svg>
    </div>

    <!-- ===== НЕОНОВОЕ СВЕЧЕНИЕ ===== -->
    <div class="neon-glow"></div>

    <!-- ===== ПОДПИСЬ ===== -->
    <div class="signature">
        <span class="text">SQST</span>
        <span class="symbol">✦</span>
    </div>

    <!-- ===== ФУТЕР ===== -->
    <div class="footer">✦</div>

</body>
</html>
