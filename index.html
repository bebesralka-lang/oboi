<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SQST ✦ Интерфейс — основной блок</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 1920px;
            height: 1080px;
            overflow: hidden;
            background: #0e0c0a;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            font-family: 'Segoe UI', -apple-system, sans-serif;
        }

        /* ===== ФОН С ВОЛНАМИ (без изменений) ===== */
        .waves-container {
            position: absolute;
            inset: 0;
            z-index: 0;
            overflow: hidden;
        }

        .waves-container svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        .center-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 45%;
            height: 65%;
            background: radial-gradient(ellipse at center, #b68c4a 0%, #a46e37 25%, #74563c 50%, transparent 70%);
            filter: blur(80px);
            z-index: 0;
            pointer-events: none;
            opacity: 0.7;
        }

        .shadow-left {
            position: absolute;
            top: 0;
            left: 0;
            width: 25%;
            height: 100%;
            background: linear-gradient(to right, rgba(14, 12, 10, 0.7) 0%, transparent 100%);
            z-index: 1;
            pointer-events: none;
        }

        .shadow-right {
            position: absolute;
            top: 0;
            right: 0;
            width: 25%;
            height: 100%;
            background: linear-gradient(to left, rgba(14, 12, 10, 0.7) 0%, transparent 100%);
            z-index: 1;
            pointer-events: none;
        }

        /* ===== ОСНОВНОЙ БЛОК СЛЕВА (увеличенный) ===== */
        .main-block {
            position: absolute;
            left: 60px;
            top: 50%;
            transform: translateY(-50%);
            width: 440px;
            background: #f7eabe;
            border-radius: 32px;
            padding: 30px 28px 32px;
            z-index: 10;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        /* ===== ХЭШТЕГ SQST ===== */
        .hash-sqst {
            font-size: 18px;
            font-weight: 400;
            color: #4a3728;
            letter-spacing: 3px;
            opacity: 0.5;
            margin-bottom: 18px;
            user-select: none;
        }

        /* ===== ИНДИКАТОР ЛИСТАНИЯ (тире точка точка) ===== */
        .pagination {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 18px;
            user-select: none;
        }

        .pagination .line {
            width: 24px;
            height: 2px;
            background: #4a3728;
            opacity: 0.15;
            border-radius: 2px;
        }

        .pagination .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #4a3728;
            opacity: 0.15;
        }

        /* ===== ВЕРХНИЙ РЯД: прямоугольник + кнопка включения ===== */
        .top-row {
            display: flex;
            gap: 14px;
            margin-bottom: 18px;
        }

        .rect-rounded {
            width: 140px;
            height: 56px;
            border-radius: 16px;
            background: #d2b27c;
            box-shadow:
                0 0 20px rgba(210, 178, 124, 0.15),
                0 0 40px rgba(210, 178, 124, 0.05),
                inset 2px 2px 8px rgba(255, 255, 255, 0.3),
                inset -2px -2px 8px rgba(0, 0, 0, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .rect-circle {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: linear-gradient(145deg, #a46431, #ad7f48);
            box-shadow:
                0 0 24px rgba(164, 100, 49, 0.2),
                0 0 48px rgba(164, 100, 49, 0.08),
                inset 2px 2px 8px rgba(255, 255, 255, 0.2),
                inset -2px -2px 8px rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            border: 1px solid rgba(255, 255, 255, 0.06);
            cursor: pointer;
        }

        .rect-circle .dot {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.1);
        }

        /* ===== НИЖНИЙ РЯД: прямоугольник с облачком + кружок слева ===== */
        .bottom-row {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .small-circle {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: #a46431;
            flex-shrink: 0;
            box-shadow: 0 0 16px rgba(164, 100, 49, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .rect-cloud {
            flex: 1;
            height: 56px;
            border-radius: 16px;
            background: linear-gradient(to bottom, #d2b27c, #a46431);
            box-shadow:
                0 0 20px rgba(210, 178, 124, 0.1),
                inset 2px 2px 8px rgba(255, 255, 255, 0.2),
                inset -2px -2px 8px rgba(0, 0, 0, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .cloud-icon {
            font-size: 22px;
            color: rgba(255, 255, 255, 0.15);
            position: relative;
        }

        .cloud-icon::after {
            content: '';
            position: absolute;
            top: 50%;
            left: -8px;
            right: -8px;
            height: 2px;
            background: rgba(255, 255, 255, 0.15);
            transform: rotate(-12deg);
            border-radius: 2px;
        }

        /* ===== НАЛОЖЕННЫЙ БЛОК (справа, повторяет фон) ===== */
        .overlay-block {
            position: absolute;
            right: -20px;
            top: 50%;
            transform: translateY(-50%);
            width: 160px;
            height: 280px;
            background: #0e0c0a;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            z-index: 5;
        }

        /* ===== МИНИ-ВОЛНЫ ВНУТРИ НАЛОЖЕННОГО БЛОКА ===== */
        .overlay-block .mini-waves {
            position: absolute;
            inset: 0;
            opacity: 0.3;
        }

        .overlay-block .mini-waves svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* ===== ДЛИННЫЙ ПРЯМОУГОЛЬНИК СВЕРХУ В НАЛОЖЕННОМ БЛОКЕ ===== */
        .overlay-top-bar {
            position: absolute;
            top: 14px;
            left: 50%;
            transform: translateX(-50%);
            width: 85%;
            height: 60px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.02);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 0 8px;
            backdrop-filter: blur(2px);
        }

        .mini-rect {
            width: 28px;
            height: 28px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.02);
            flex-shrink: 0;
        }

        /* ===== ДВА ПРЯМОУГОЛЬНИКА ВНИЗУ (один правее, другой ниже-левее) ===== */
        .overlay-bottom-rects {
            position: absolute;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            width: 85%;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 6px;
        }

        .overlay-bottom-rects .rect-right {
            width: 40px;
            height: 16px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.02);
        }

        .overlay-bottom-rects .rect-left {
            width: 28px;
            height: 16px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.02);
            align-self: flex-start;
            margin-left: -10px;
        }

        /* ===== ПОДПИСЬ ===== */
        .signature {
            position: absolute;
            bottom: 30px;
            right: 40px;
            z-index: 2;
            font-family: 'Georgia', serif;
            color: rgba(206, 170, 115, 0.04);
            font-size: 10px;
            letter-spacing: 5px;
            text-transform: uppercase;
            user-select: none;
        }

        /* ===== АДАПТАЦИЯ ===== */
        @media (max-width: 1920px) {
            body {
                width: 100vw;
                height: 100vh;
            }
        }
    </style>
</head>
<body>

    <!-- ===== ФОН С ВОЛНАМИ ===== -->
    <div class="waves-container">
        <svg viewBox="0 0 1920 1080" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="gradMain" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#0e0c0a" />
                    <stop offset="15%" stop-color="#343434" />
                    <stop offset="30%" stop-color="#4d2714" />
                    <stop offset="40%" stop-color="#50392b" />
                    <stop offset="50%" stop-color="#74563c" />
                    <stop offset="60%" stop-color="#a46e37" />
                    <stop offset="70%" stop-color="#b68c4a" />
                    <stop offset="80%" stop-color="#a46e37" />
                    <stop offset="90%" stop-color="#4d2714" />
                    <stop offset="100%" stop-color="#0e0c0a" />
                </linearGradient>
            </defs>
            <rect width="1920" height="1080" fill="url(#gradMain)" opacity="1" />
            <path d="M 0 0 C 80 200, 40 400, 80 600 C 120 800, 60 1000, 0 1080 L 0 0 Z" fill="#4d2714" opacity="0.3" />
            <path d="M 200 0 C 300 180, 250 400, 300 600 C 350 800, 280 1000, 200 1080 L 200 0 Z" fill="#50392b" opacity="0.25" />
            <path d="M 400 0 C 520 200, 460 400, 520 600 C 580 800, 500 1000, 400 1080 L 400 0 Z" fill="#74563c" opacity="0.2" />
            <path d="M 1520 0 C 1400 200, 1460 400, 1400 600 C 1340 800, 1420 1000, 1520 1080 L 1520 0 Z" fill="#74563c" opacity="0.2" />
            <path d="M 1720 0 C 1620 180, 1670 400, 1620 600 C 1570 800, 1640 1000, 1720 1080 L 1720 0 Z" fill="#50392b" opacity="0.25" />
            <path d="M 1920 0 C 1840 200, 1880 400, 1840 600 C 1800 800, 1860 1000, 1920 1080 L 1920 0 Z" fill="#4d2714" opacity="0.3" />
            <path d="M 700 0 C 820 250, 760 500, 820 750 C 880 1000, 800 1050, 700 1080 L 1220 1080 C 1120 1050, 1040 1000, 1100 750 C 1160 500, 1100 250, 1220 0 Z" fill="#b68c4a" opacity="0.08" />
            <path d="M 900 0 C 980 300, 920 600, 980 900 C 1040 1050, 1000 1080, 900 1080 L 1020 1080 C 940 1050, 980 900, 920 600 C 860 300, 920 0, 1020 0 Z" fill="#b68c4a" opacity="0.05" />
            <path d="M 0 0 C 200 200, 300 500, 200 800 C 100 1000, 50 1050, 0 1080 L 0 0 Z" fill="#0e0c0a" opacity="0.4" />
            <path d="M 1920 0 C 1720 200, 1620 500, 1720 800 C 1820 1000, 1870 1050, 1920 1080 L 1920 0 Z" fill="#0e0c0a" opacity="0.4" />
            <path d="M 0 100 C 300 0, 600 200, 900 50 C 1200 -100, 1500 150, 1920 80" stroke="#b68c4a" stroke-width="1.5" fill="none" opacity="0.06" />
            <path d="M 0 980 C 300 1080, 600 880, 900 1030 C 1200 1180, 1500 930, 1920 1000" stroke="#b68c4a" stroke-width="1.5" fill="none" opacity="0.06" />
        </svg>
    </div>

    <div class="center-glow"></div>
    <div class="shadow-left"></div>
    <div class="shadow-right"></div>

    <!-- ===== ОСНОВНОЙ БЛОК СЛЕВА ===== -->
    <div class="main-block">

        <!-- Хэштег: #Sqst -->
        <div class="hash-sqst">#Sqst</div>

        <!-- Индикатор листания: тире точка точка -->
        <div class="pagination">
            <span class="line"></span>
            <span class="dot"></span>
            <span class="dot"></span>
        </div>

        <!-- Верхний ряд: прямоугольник + кнопка включения -->
        <div class="top-row">
            <div class="rect-rounded"></div>
            <div class="rect-circle">
                <div class="dot"></div>
            </div>
        </div>

        <!-- Нижний ряд: кружок + прямоугольник с облачком -->
        <div class="bottom-row">
            <div class="small-circle"></div>
            <div class="rect-cloud">
                <span class="cloud-icon">☁</span>
            </div>
        </div>

        <!-- ===== НАЛОЖЕННЫЙ БЛОК (справа, повторяет фон) ===== -->
        <div class="overlay-block">

            <!-- Мини-волны внутри -->
            <div class="mini-waves">
                <svg viewBox="0 0 160 280" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
                    <rect width="160" height="280" fill="#0e0c0a" />
                    <path d="M 0 0 C 40 40, 60 100, 80 140 C 100 180, 120 240, 160 280 L 0 280 Z" fill="#1a1a1a" opacity="0.3" />
                    <path d="M 0 40 C 30 80, 50 120, 70 160 C 90 200, 110 240, 160 280 L 0 280 Z" fill="#2a2a2a" opacity="0.15" />
                </svg>
            </div>

            <!-- Длинный прямоугольник сверху с 4 мини-блоками -->
            <div class="overlay-top-bar">
                <div class="mini-rect"></div>
                <div class="mini-rect"></div>
                <div class="mini-rect"></div>
                <div class="mini-rect"></div>
            </div>

            <!-- Два прямоугольника внизу -->
            <div class="overlay-bottom-rects">
                <div class="rect-right"></div>
                <div class="rect-left"></div>
            </div>

        </div>

    </div>

    <!-- ===== ПОДПИСЬ ===== -->
    <div class="signature">SQST ✦</div>

</body>
</html>
