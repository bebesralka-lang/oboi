<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SQST ✦ Обои — Золотой неон</title>
    <style>
        /* ========== СБРОС ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 1920px;
            height: 1080px;
            overflow: hidden;
            background: #faf6ed;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Georgia', serif;
            position: relative;
        }

        /* ========== ХАОТИЧНЫЕ ЛИНИИ ========== */
        .chaos-lines {
            position: absolute;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            opacity: 0.6;
        }

        .chaos-lines svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* ========== НЕОНОВОЕ СВЕЧЕНИЕ (задний слой) ========== */
        .neon-glow {
            position: absolute;
            bottom: 80px;
            right: 100px;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(201, 169, 110, 0.25) 0%, transparent 70%);
            z-index: 1;
            pointer-events: none;
            filter: blur(20px);
            animation: glowPulse 3s ease-in-out infinite alternate;
        }

        @keyframes glowPulse {
            0% {
                transform: scale(1);
                opacity: 0.6;
            }
            100% {
                transform: scale(1.3);
                opacity: 1;
            }
        }

        /* ========== СИМВОЛ И ТЕКСТ (правый нижний угол) ========== */
        .signature {
            position: absolute;
            bottom: 50px;
            right: 60px;
            z-index: 2;
            display: flex;
            align-items: center;
            gap: 12px;
            font-family: 'Georgia', serif;
        }

        .symbol {
            font-size: 110px;
            color: #c9a96e;
            text-shadow:
                0 0 30px rgba(201, 169, 110, 0.6),
                0 0 60px rgba(201, 169, 110, 0.3),
                0 0 100px rgba(201, 169, 110, 0.15),
                0 0 200px rgba(201, 169, 110, 0.08);
            animation: neonPulse 2.5s ease-in-out infinite;
            font-weight: 400;
            letter-spacing: 2px;
            line-height: 1;
        }

        .text {
            font-size: 18px;
            letter-spacing: 6px;
            color: #c9a96e;
            opacity: 0.5;
            font-weight: 300;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        @keyframes neonPulse {
            0%, 100% {
                text-shadow:
                    0 0 30px rgba(201, 169, 110, 0.6),
                    0 0 60px rgba(201, 169, 110, 0.3),
                    0 0 100px rgba(201, 169, 110, 0.15);
                transform: scale(1);
            }
            50% {
                text-shadow:
                    0 0 50px rgba(201, 169, 110, 0.8),
                    0 0 100px rgba(201, 169, 110, 0.4),
                    0 0 150px rgba(201, 169, 110, 0.2),
                    0 0 250px rgba(201, 169, 110, 0.08);
                transform: scale(1.02);
            }
        }

        /* ========== ФУТЕР (микро) ========== */
        .footer {
            position: absolute;
            bottom: 20px;
            left: 40px;
            z-index: 1;
            font-family: 'Georgia', serif;
            font-size: 9px;
            letter-spacing: 3px;
            color: rgba(160, 152, 136, 0.15);
            pointer-events: none;
            text-transform: uppercase;
        }

        /* ========== АДАПТАЦИЯ ========== */
        @media (max-width: 1920px) {
            body {
                width: 100vw;
                height: 100vh;
            }
        }

        @media (max-width: 768px) {
            .symbol {
                font-size: 60px;
            }
            .text {
                font-size: 12px;
                letter-spacing: 4px;
            }
            .signature {
                bottom: 30px;
                right: 30px;
            }
            .neon-glow {
                width: 200px;
                height: 200px;
                bottom: 40px;
                right: 50px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== ХАОТИЧНЫЕ ЛИНИИ ===== -->
    <div class="chaos-lines">
        <svg viewBox="0 0 1920 1080" preserveAspectRatio="none">
            <!-- Линия 1 — плавная волна -->
            <path d="
                M -50 200
                C 200 100, 400 300, 600 180
                C 800 60, 1000 250, 1200 150
                C 1400 50, 1600 220, 1970 120
            " stroke="#c9a96e" stroke-width="1.2" fill="none" opacity="0.2" />

            <!-- Линия 2 — хаотичная, резкая -->
            <path d="
                M -50 400
                C 150 350, 350 500, 550 380
                C 750 260, 950 480, 1150 350
                C 1350 220, 1550 450, 1970 320
            " stroke="#c9a96e" stroke-width="0.8" fill="none" opacity="0.15" />

            <!-- Линия 3 — почти прямая с изгибом -->
            <path d="
                M -50 600
                C 300 580, 500 650, 700 590
                C 900 530, 1100 670, 1300 580
                C 1500 490, 1700 650, 1970 560
            " stroke="#c9a96e" stroke-width="1" fill="none" opacity="0.12" />

            <!-- Линия 4 — короткая хаотичная -->
            <path d="
                M 200 800
                C 400 770, 500 870, 700 790
                C 900 710, 1100 850, 1300 780
            " stroke="#c9a96e" stroke-width="0.6" fill="none" opacity="0.1" />

            <!-- Линия 5 — вертикальная дуга -->
            <path d="
                M 100 1080
                C 120 800, 180 600, 160 400
                C 140 200, 200 100, 180 -50
            " stroke="#c9a96e" stroke-width="0.6" fill="none" opacity="0.07" />

            <!-- Линия 6 — диагональная -->
            <path d="
                M -50 900
                C 400 850, 800 950, 1200 880
                C 1600 810, 1800 920, 1970 860
            " stroke="#c9a96e" stroke-width="0.7" fill="none" opacity="0.08" />
        </svg>
    </div>

    <!-- ===== НЕОНОВОЕ СВЕЧЕНИЕ ===== -->
    <div class="neon-glow"></div>

    <!-- ===== ПОДПИСЬ: СИМВОЛ + ТЕКСТ ===== -->
    <div class="signature">
        <span class="text">SQST</span>
        <span class="symbol">✦</span>
    </div>

    <!-- ===== МИКРО-ФУТЕР ===== -->
    <div class="footer">✦</div>

</body>
</html>
