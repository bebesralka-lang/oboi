<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SQST ✦ Интерфейс — тёмная тема</title>
    <style>
        /* ========== СБРОС ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 1920px;
            height: 1080px;
            overflow: hidden;
            background: #1f140e;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', -apple-system, sans-serif;
            position: relative;
        }

        /* ========== ФОН: РАЗМЫТЫЙ ГРАДИЕНТ ========== */
        .bg {
            position: absolute;
            inset: 0;
            z-index: 0;
            background:
                radial-gradient(ellipse at 20% 30%, #804a23 0%, transparent 50%),
                radial-gradient(ellipse at 80% 70%, #54444c 0%, transparent 50%),
                radial-gradient(ellipse at 50% 100%, #1f140e 0%, transparent 60%),
                #1f140e;
            filter: blur(2px);
        }

        /* ========== СВЕТОВЫЕ ПЯТНА (глубина) ========== */
        .light-spot {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            filter: blur(120px);
        }

        .light-spot:nth-child(2) {
            top: -10%;
            right: -5%;
            width: 60%;
            height: 60%;
            background: radial-gradient(circle, rgba(206, 170, 115, 0.08) 0%, transparent 70%);
        }

        .light-spot:nth-child(3) {
            bottom: -10%;
            left: -5%;
            width: 50%;
            height: 50%;
            background: radial-gradient(circle, rgba(190, 152, 100, 0.06) 0%, transparent 70%);
        }

        /* ========== КОНТЕЙНЕР С ИНТЕРФЕЙСНЫМИ БЛОКАМИ ========== */
        .interface {
            position: relative;
            z-index: 1;
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            max-width: 900px;
            justify-content: center;
            align-items: flex-start;
            padding: 20px;
        }

        /* ===== БЛОКИ С МАТОВЫМ СТЕКЛОМ ===== */
        .glass-card {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 28px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.03);
            padding: 24px 28px 28px;
            transition: 0.4s;
            flex: 1 1 240px;
            min-width: 200px;
        }

        .glass-card:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(206, 170, 115, 0.06);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5);
            transform: translateY(-2px);
        }

        .glass-card .title {
            font-size: 11px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: rgba(206, 170, 115, 0.3);
            margin-bottom: 14px;
            font-weight: 500;
        }

        .glass-card .title .gold {
            color: rgba(206, 170, 115, 0.5);
        }

        /* ===== ЭЛЕМЕНТЫ УПРАВЛЕНИЯ ===== */
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-top: 4px;
        }

        .control-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .control-row .label {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.25);
            font-weight: 300;
            letter-spacing: 0.5px;
        }

        .control-row .value {
            font-size: 12px;
            color: rgba(206, 170, 115, 0.5);
            font-weight: 400;
            min-width: 24px;
            text-align: right;
        }

        /* ===== СЛАЙДЕРЫ ===== */
        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 3px;
            border-radius: 10px;
            outline: none;
            background: rgba(255, 255, 255, 0.04);
            transition: 0.3s;
            cursor: pointer;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: radial-gradient(circle, #ceaa73, #be9864);
            cursor: pointer;
            box-shadow: 0 0 20px rgba(206, 170, 115, 0.2);
            border: none;
        }

        input[type="range"]::-moz-range-thumb {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: radial-gradient(circle, #ceaa73, #be9864);
            cursor: pointer;
            border: none;
        }

        /* ===== ПЕРЕКЛЮЧАТЕЛИ (TOGGLE) ===== */
        .toggle {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }

        .toggle .track {
            width: 36px;
            height: 20px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 30px;
            position: relative;
            transition: 0.4s;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .toggle .track .thumb {
            width: 14px;
            height: 14px;
            background: radial-gradient(circle, #ceaa73, #be9864);
            border-radius: 50%;
            position: absolute;
            top: 2px;
            left: 2px;
            transition: 0.4s;
            box-shadow: 0 0 20px rgba(206, 170, 115, 0.1);
        }

        .toggle.active .track .thumb {
            left: 18px;
        }

        .toggle .label {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.25);
            font-weight: 300;
            letter-spacing: 0.5px;
        }

        /* ===== КНОПКИ С ИКОНКАМИ ===== */
        .btn-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 6px;
        }

        .icon-btn {
            width: 40px;
            height: 40px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.03);
            color: rgba(255, 255, 255, 0.2);
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.4s;
            font-family: 'Segoe UI', sans-serif;
            backdrop-filter: blur(4px);
        }

        .icon-btn:hover {
            background: rgba(206, 170, 115, 0.04);
            border-color: rgba(206, 170, 115, 0.08);
            color: rgba(206, 170, 115, 0.4);
            transform: scale(1.02);
        }

        .icon-btn .gold {
            color: rgba(206, 170, 115, 0.3);
        }

        .icon-btn .star {
            font-size: 18px;
        }

        /* ===== ИКОНКА ✦ В ПРАВОМ НИЖНЕМ УГЛУ ===== */
        .signature {
            position: absolute;
            bottom: 30px;
            right: 40px;
            z-index: 2;
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: 'Georgia', serif;
        }

        .signature .symbol {
            font-size: 40px;
            color: rgba(206, 170, 115, 0.15);
            text-shadow: 0 0 40px rgba(206, 170, 115, 0.03);
            letter-spacing: 2px;
            font-weight: 400;
        }

        .signature .text {
            font-size: 10px;
            letter-spacing: 4px;
            color: rgba(206, 170, 115, 0.04);
            text-transform: uppercase;
            font-weight: 300;
        }

        /* ========== АДАПТАЦИЯ ========== */
        @media (max-width: 1920px) {
            body {
                width: 100vw;
                height: 100vh;
            }
        }

        @media (max-width: 768px) {
            .interface {
                padding: 10px;
                gap: 16px;
            }
            .glass-card {
                padding: 18px 16px 20px;
                min-width: 140px;
                flex: 1 1 160px;
            }
            .glass-card .title {
                font-size: 9px;
                letter-spacing: 2px;
            }
            .control-row .label {
                font-size: 10px;
            }
            .icon-btn {
                width: 34px;
                height: 34px;
                font-size: 13px;
                border-radius: 10px;
            }
            .signature .symbol {
                font-size: 28px;
            }
            .signature .text {
                font-size: 8px;
                letter-spacing: 3px;
            }
            .signature {
                bottom: 20px;
                right: 20px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== ТЁМНЫЙ ФОН ===== -->
    <div class="bg"></div>
    <div class="light-spot"></div>
    <div class="light-spot"></div>

    <!-- ===== ИНТЕРФЕЙСНЫЕ БЛОКИ ===== -->
    <div class="interface">

        <!-- ===== БЛОК 1: СЛАЙДЕРЫ ===== -->
        <div class="glass-card">
            <div class="title">✦ <span class="gold">Настройки</span></div>
            <div class="control-group">
                <div class="control-row">
                    <span class="label">Яркость</span>
                    <input type="range" min="0" max="100" value="65" />
                    <span class="value">65%</span>
                </div>
                <div class="control-row">
                    <span class="label">Контраст</span>
                    <input type="range" min="0" max="100" value="42" />
                    <span class="value">42%</span>
                </div>
                <div class="control-row">
                    <span class="label">Свечение</span>
                    <input type="range" min="0" max="100" value="80" />
                    <span class="value">80%</span>
                </div>
            </div>
        </div>

        <!-- ===== БЛОК 2: ПЕРЕКЛЮЧАТЕЛИ ===== -->
        <div class="glass-card">
            <div class="title">✦ <span class="gold">Режимы</span></div>
            <div class="control-group">
                <div class="toggle active" onclick="this.classList.toggle('active')">
                    <div class="track"><div class="thumb"></div></div>
                    <span class="label">Неон</span>
                </div>
                <div class="toggle" onclick="this.classList.toggle('active')">
                    <div class="track"><div class="thumb"></div></div>
                    <span class="label">Гравировка</span>
                </div>
                <div class="toggle active" onclick="this.classList.toggle('active')">
                    <div class="track"><div class="thumb"></div></div>
                    <span class="label">Матовое стекло</span>
                </div>
            </div>
        </div>

        <!-- ===== БЛОК 3: КНОПКИ С ИКОНКАМИ ===== -->
        <div class="glass-card">
            <div class="title">✦ <span class="gold">Инструменты</span></div>
            <div class="btn-row">
                <div class="icon-btn">✦</div>
                <div class="icon-btn">✧</div>
                <div class="icon-btn">⌘</div>
                <div class="icon-btn">⚙</div>
                <div class="icon-btn">✚</div>
                <div class="icon-btn">◈</div>
                <div class="icon-btn">⌂</div>
                <div class="icon-btn">✦</div>
            </div>
            <div class="btn-row" style="margin-top: 6px;">
                <div class="icon-btn" style="flex:1; justify-content:center; gap:6px; font-size:12px; color:rgba(206,170,115,0.2);">
                    <span>✦</span> Применить
                </div>
                <div class="icon-btn" style="flex:1; justify-content:center; gap:6px; font-size:12px; color:rgba(255,255,255,0.1);">
                    <span>✧</span> Сброс
                </div>
            </div>
        </div>

    </div>

    <!-- ===== ПОДПИСЬ ===== -->
    <div class="signature">
        <span class="text">SQST</span>
        <span class="symbol">✦</span>
    </div>

    <!-- ===== МИКРО-СКРИПТ ДЛЯ ТОГГЛОВ ===== -->
    <script>
        document.querySelectorAll('.toggle').forEach(t => {
            t.addEventListener('click', function(e) {
                // Не даём сработать дважды при клике на трек
                if (e.target.closest('.track')) return;
                this.classList.toggle('active');
            });
            // Клик по треку тоже переключает
            t.querySelector('.track').addEventListener('click', function(e) {
                e.stopPropagation();
                this.closest('.toggle').classList.toggle('active');
            });
        });
    </script>

</body>
</html>
