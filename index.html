<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SQST ✦ UI-концепт — стеклянные слои</title>
    <style>
        /* ========== СБРОС ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 1920px;
            height: 1080px;
            overflow: hidden;
            background: #1a100e;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', -apple-system, sans-serif;
            position: relative;
        }

        /* ========== ФОН ========== */
        .bg {
            position: absolute;
            inset: 0;
            z-index: 0;
            background:
                radial-gradient(ellipse at 25% 30%, #804a23 0%, transparent 55%),
                radial-gradient(ellipse at 75% 70%, #54444c 0%, transparent 50%),
                radial-gradient(ellipse at 50% 100%, #1f140e 0%, transparent 60%),
                #1a100e;
            filter: blur(2px);
        }

        /* ===== БОКЕ-ПЯТНА ===== */
        .bokeh {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            filter: blur(150px);
        }
        .bokeh:nth-child(2) { top: -15%; right: -10%; width: 60%; height: 60%; background: radial-gradient(circle, rgba(206, 170, 115, 0.06) 0%, transparent 70%); }
        .bokeh:nth-child(3) { bottom: -10%; left: -10%; width: 55%; height: 55%; background: radial-gradient(circle, rgba(190, 152, 100, 0.05) 0%, transparent 70%); }
        .bokeh:nth-child(4) { top: 40%; left: 35%; width: 40%; height: 40%; background: radial-gradient(circle, rgba(171, 120, 64, 0.03) 0%, transparent 70%); }
        .bokeh:nth-child(5) { bottom: 30%; right: 20%; width: 30%; height: 30%; background: radial-gradient(circle, rgba(206, 170, 115, 0.04) 0%, transparent 70%); }

        /* ===== ВИНЬЕТКА ===== */
        .vignette {
            position: absolute;
            inset: 0;
            z-index: 0;
            background: radial-gradient(ellipse at center, transparent 50%, rgba(0, 0, 0, 0.15) 100%);
            pointer-events: none;
        }

        /* ========== СТЕКЛЯННЫЕ СЛОИ ========== */
        .layers {
            position: relative;
            z-index: 1;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ===== СЛОЙ 2: ДАЛЬНИЕ ПАНЕЛИ (размытые) ===== */
        .layer-back {
            position: absolute;
            border-radius: 28px;
            background: rgba(60, 40, 35, 0.2);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.01);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.3);
            pointer-events: none;
            filter: blur(8px);
        }
        .layer-back:nth-child(1) {
            width: 380px;
            height: 480px;
            top: 15%;
            right: 20%;
            transform: rotate(5deg);
            background: rgba(80, 55, 45, 0.15);
        }
        .layer-back:nth-child(2) {
            width: 300px;
            height: 400px;
            bottom: 20%;
            left: 25%;
            transform: rotate(-8deg);
            background: rgba(70, 50, 40, 0.12);
        }

        /* ===== СЛОЙ 3: ОСНОВНЫЕ ПАНЕЛИ ===== */

        /* ПАНЕЛЬ A — центральная кремовая */
        .panel-a {
            position: absolute;
            width: 440px;
            height: 360px;
            top: 32%;
            left: 28%;
            border-radius: 32px;
            background: rgba(255, 248, 240, 0.06);
            backdrop-filter: blur(40px);
            border: 1px solid rgba(255, 248, 240, 0.03);
            box-shadow:
                0 30px 100px rgba(0, 0, 0, 0.5),
                0 0 0 1px rgba(255, 248, 240, 0.01) inset,
                0 0 60px rgba(206, 170, 115, 0.02) inset;
            transform: rotateY(-4deg) rotateX(2deg) translateZ(10px);
            padding: 28px 30px;
            pointer-events: none;
        }

        /* ПАНЕЛЬ B — стеклянная поверх A (наклонена поперёк) */
        .panel-b {
            position: absolute;
            width: 320px;
            height: 280px;
            top: 38%;
            left: 44%;
            border-radius: 28px;
            background: rgba(120, 80, 60, 0.15);
            backdrop-filter: blur(40px);
            border: 1px solid rgba(255, 255, 255, 0.02);
            box-shadow:
                0 25px 80px rgba(0, 0, 0, 0.3),
                0 0 0 1px rgba(255, 255, 255, 0.01) inset,
                0 0 40px rgba(206, 170, 115, 0.02) inset;
            transform: rotateY(3deg) rotateX(-2deg) translateZ(30px);
            padding: 20px 22px;
            pointer-events: none;
        }

        /* ПАНЕЛЬ C — узкая тёмная справа */
        .panel-c {
            position: absolute;
            width: 160px;
            height: 340px;
            top: 34%;
            right: 22%;
            border-radius: 24px;
            background: rgba(60, 40, 35, 0.25);
            backdrop-filter: blur(35px);
            border: 1px solid rgba(255, 255, 255, 0.02);
            box-shadow:
                0 25px 80px rgba(0, 0, 0, 0.3),
                0 0 0 1px rgba(255, 255, 255, 0.01) inset;
            transform: rotateY(2deg) rotateX(-3deg) translateZ(20px);
            padding: 20px 16px;
            pointer-events: none;
        }

        /* ===== ЭЛЕМЕНТЫ УПРАВЛЕНИЯ ===== */

        /* СЛАЙДЕРЫ (на панели A) */
        .slider-group {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-top: 14px;
        }

        .slider-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .slider-row .name {
            font-size: 10px;
            color: rgba(255, 248, 240, 0.08);
            font-weight: 300;
            min-width: 42px;
            letter-spacing: 0.5px;
        }

        .slider-track {
            flex: 1;
            height: 3px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.03);
            position: relative;
            box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.2);
        }

        .slider-track .fill {
            height: 100%;
            border-radius: 10px;
            background: linear-gradient(90deg, rgba(206, 170, 115, 0.15), rgba(206, 170, 115, 0.3));
        }

        .slider-track .thumb {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: radial-gradient(circle at 40% 35%, #f5e6bc, #ceaa73);
            position: absolute;
            top: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 2px 12px rgba(206, 170, 115, 0.08), 0 4px 20px rgba(0, 0, 0, 0.15);
        }

        .slider-row .value {
            font-size: 10px;
            color: rgba(206, 170, 115, 0.12);
            min-width: 20px;
            text-align: right;
            font-weight: 300;
        }

        /* ТУМБЛЕРЫ (на панели A) */
        .toggle-group {
            display: flex;
            gap: 20px;
            margin-top: 12px;
        }

        .toggle-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .toggle-track {
            width: 32px;
            height: 18px;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.02);
            position: relative;
            box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.2);
        }

        .toggle-track .thumb {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: radial-gradient(circle at 40% 35%, #f5e6bc, #ceaa73);
            position: absolute;
            top: 2px;
            left: 2px;
            box-shadow: 0 2px 12px rgba(206, 170, 115, 0.05), 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .toggle-track.active .thumb { left: 16px; }
        .toggle-item .name {
            font-size: 9px;
            color: rgba(255, 248, 240, 0.06);
            font-weight: 300;
            letter-spacing: 0.5px;
        }

        /* ИКОНКИ-КНОПКИ (на панели A) */
        .icon-row {
            display: flex;
            gap: 8px;
            margin-top: 14px;
        }

        .icon-btn {
            width: 36px;
            height: 36px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.01);
            border: 1px solid rgba(255, 255, 255, 0.02);
            color: rgba(255, 255, 255, 0.06);
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }

        .icon-btn .gold { color: rgba(206, 170, 115, 0.06); }

        /* ШИРОКИЕ КНОПКИ (на панели A) */
        .action-row {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .action-btn {
            flex: 1;
            padding: 8px 0;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.01);
            border: 1px solid rgba(255, 255, 255, 0.02);
            color: rgba(255, 255, 255, 0.04);
            font-size: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }

        .action-btn .gold { color: rgba(206, 170, 115, 0.05); }

        /* ИКОНКИ НА ПАНЕЛИ B */
        .panel-b-icons {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-top: 30px;
        }

        .b-icon {
            aspect-ratio: 1 / 1;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.01);
            border: 1px solid rgba(255, 255, 255, 0.02);
            color: rgba(255, 255, 255, 0.05);
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .b-icon .gold { color: rgba(206, 170, 115, 0.05); }

        /* ИНДИКАТОРЫ НА ПАНЕЛИ C */
        .indicator-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 30px;
            align-items: center;
        }

        .indicator-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.01);
        }
        .indicator-dot.active { background: rgba(206, 170, 115, 0.1); border-color: rgba(206, 170, 115, 0.05); }

        .indicator-line {
            width: 24px;
            height: 2px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.02);
        }
        .indicator-line.active { background: rgba(206, 170, 115, 0.06); }

        /* ===== СЛОЙ 4: ПЛАВАЮЩИЕ ИКОНКИ ===== */
        .float-icon {
            position: absolute;
            z-index: 5;
            pointer-events: none;
            color: rgba(206, 170, 115, 0.08);
            text-shadow: 0 0 40px rgba(206, 170, 115, 0.02);
        }
        .float-icon:nth-child(1) { font-size: 32px; top: 22%; left: 18%; }
        .float-icon:nth-child(2) { font-size: 28px; top: 18%; right: 28%; }
        .float-icon:nth-child(3) { font-size: 30px; bottom: 25%; right: 15%; }
        .float-icon:nth-child(4) { font-size: 24px; top: 45%; left: 12%; }
        .float-icon:nth-child(5) { font-size: 22px; bottom: 35%; left: 20%; }

        /* ===== СЛОЙ 5: ПСЕВДО-ТЕКСТ ===== */
        .pseudo-text {
            position: absolute;
            font-family: 'Courier New', monospace;
            color: rgba(255, 255, 255, 0.015);
            pointer-events: none;
            z-index: 6;
            font-weight: 300;
            letter-spacing: 2px;
        }
        .pseudo-text:nth-child(1) { font-size: 14px; top: 8%; left: 6%; }
        .pseudo-text:nth-child(2) { font-size: 22px; top: 14%; left: 6%; letter-spacing: 6px; font-weight: 400; }
        .pseudo-text:nth-child(3) { font-size: 12px; bottom: 12%; left: 8%; }
        .pseudo-text:nth-child(4) { font-size: 12px; bottom: 6%; left: 8%; letter-spacing: 4px; }
        .pseudo-text:nth-child(5) { font-size: 11px; top: 6%; right: 6%; text-align: right; }
        .pseudo-text:nth-child(6) { font-size: 9px; bottom: 20%; right: 6%; text-align: right; }

        /* ===== ГЛЯНЕЦ ===== */
        .glare {
            position: absolute;
            top: -15%;
            left: -20%;
            width: 80%;
            height: 80%;
            background: radial-gradient(ellipse at 20% 20%, rgba(255, 255, 255, 0.02) 0%, transparent 60%);
            pointer-events: none;
            z-index: 0;
            transform: rotate(-15deg);
        }

        /* ===== ПОДПИСЬ ===== */
        .signature {
            position: absolute;
            bottom: 24px;
            right: 32px;
            z-index: 7;
            font-family: 'Georgia', serif;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .signature .symbol {
            font-size: 32px;
            color: rgba(206, 170, 115, 0.05);
            text-shadow: 0 0 40px rgba(206, 170, 115, 0.02);
        }
        .signature .text {
            font-size: 9px;
            letter-spacing: 5px;
            color: rgba(206, 170, 115, 0.02);
            text-transform: uppercase;
            font-weight: 300;
        }

        /* ========== АДАПТАЦИЯ ========== */
        @media (max-width: 1920px) {
            body { width: 100vw; height: 100vh; }
        }
        @media (max-width: 768px) {
            .panel-a { width: 300px; height: 280px; top: 30%; left: 10%; padding: 18px; }
            .panel-b { width: 220px; height: 200px; top: 40%; left: 35%; padding: 14px; }
            .panel-c { width: 100px; height: 220px; top: 35%; right: 8%; padding: 12px; }
            .slider-row .name { font-size: 8px; min-width: 30px; }
            .slider-row .value { font-size: 8px; min-width: 16px; }
            .toggle-item .name { font-size: 7px; }
            .icon-btn { width: 28px; height: 28px; font-size: 11px; border-radius: 10px; }
            .action-btn { font-size: 8px; padding: 6px 0; }
            .b-icon { font-size: 14px; }
            .float-icon { display: none; }
            .pseudo-text { display: none; }
            .signature .symbol { font-size: 20px; }
            .signature .text { font-size: 7px; letter-spacing: 3px; }
            .signature { bottom: 12px; right: 12px; }
            .layer-back { display: none; }
        }
    </style>
</head>
<body>

    <!-- ===== ФОН ===== -->
    <div class="bg"></div>
    <div class="bokeh"></div>
    <div class="bokeh"></div>
    <div class="bokeh"></div>
    <div class="bokeh"></div>
    <div class="vignette"></div>
    <div class="glare"></div>

    <!-- ===== СЛОЙ 2: ДАЛЬНИЕ ПАНЕЛИ ===== -->
    <div class="layer-back"></div>
    <div class="layer-back"></div>

    <!-- ===== ПЛАВАЮЩИЕ ИКОНКИ (Слой 4) ===== -->
    <div class="float-icon">✦</div>
    <div class="float-icon">◈</div>
    <div class="float-icon">⚙</div>
    <div class="float-icon">✚</div>
    <div class="float-icon">⌘</div>

    <!-- ===== ПСЕВДО-ТЕКСТ (Слой 5) ===== -->
    <div class="pseudo-text">OMGGso</div>
    <div class="pseudo-text">#arTYh)</div>
    <div class="pseudo-text">CVI xaa TOR43()</div>
    <div class="pseudo-text">✦ interface v.2</div>
    <div class="pseudo-text">SQST // design</div>
    <div class="pseudo-text">neo.morphism // 2026</div>

    <!-- ===== ОСНОВНЫЕ ПАНЕЛИ (Слой 3) ===== -->

    <!-- ПАНЕЛЬ A — кремовая -->
    <div class="panel-a">
        <div class="slider-group">
            <div class="slider-row">
                <span class="name">яркость</span>
                <div class="slider-track">
                    <div class="fill" style="width:65%;"></div>
                    <div class="thumb" style="left:65%;"></div>
                </div>
                <span class="value">65</span>
            </div>
            <div class="slider-row">
                <span class="name">контраст</span>
                <div class="slider-track">
                    <div class="fill" style="width:42%;"></div>
                    <div class="thumb" style="left:42%;"></div>
                </div>
                <span class="value">42</span>
            </div>
            <div class="slider-row">
                <span class="name">свечение</span>
                <div class="slider-track">
                    <div class="fill" style="width:80%;"></div>
                    <div class="thumb" style="left:80%;"></div>
                </div>
                <span class="value">80</span>
            </div>
        </div>

        <div class="toggle-group">
            <div class="toggle-item">
                <div class="toggle-track active"><div class="thumb" style="left:16px;"></div></div>
                <span class="name">неон</span>
            </div>
            <div class="toggle-item">
                <div class="toggle-track"><div class="thumb"></div></div>
                <span class="name">гравировка</span>
            </div>
            <div class="toggle-item">
                <div class="toggle-track active"><div class="thumb" style="left:16px;"></div></div>
                <span class="name">мат. стекло</span>
            </div>
        </div>

        <div class="icon-row">
            <div class="icon-btn"><span class="gold">✦</span></div>
            <div class="icon-btn"><span class="gold">✧</span></div>
            <div class="icon-btn"><span class="gold">⌘</span></div>
            <div class="icon-btn"><span class="gold">⚙</span></div>
            <div class="icon-btn"><span class="gold">✚</span></div>
            <div class="icon-btn"><span class="gold">◈</span></div>
            <div class="icon-btn"><span class="gold">⌂</span></div>
            <div class="icon-btn"><span class="gold">✦</span></div>
        </div>

        <div class="action-row">
            <div class="action-btn"><span class="gold">✦</span> применить</div>
            <div class="action-btn"><span>✧</span> сброс</div>
        </div>
    </div>

    <!-- ПАНЕЛЬ B — стеклянная поверх A -->
    <div class="panel-b">
        <div class="panel-b-icons">
            <div class="b-icon"><span class="gold">◈</span></div>
            <div class="b-icon"><span class="gold">✦</span></div>
            <div class="b-icon"><span class="gold">⌘</span></div>
            <div class="b-icon"><span class="gold">✚</span></div>
        </div>
    </div>

    <!-- ПАНЕЛЬ C — узкая тёмная -->
    <div class="panel-c">
        <div class="indicator-group">
            <div class="indicator-dot active"></div>
            <div class="indicator-dot active"></div>
            <div class="indicator-dot"></div>
            <div class="indicator-line active"></div>
            <div class="indicator-line"></div>
            <div class="indicator-line"></div>
        </div>
    </div>

    <!-- ===== ПОДПИСЬ ===== -->
    <div class="signature">
        <span class="text">SQST</span>
        <span class="symbol">✦</span>
    </div>

</body>
</html>
