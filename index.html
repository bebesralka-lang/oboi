<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Glassmorphism UI</title>
    <style>
        /* ===== СБРОС ===== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', -apple-system, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #2b1f16 0%, #0d0a08 50%, #3a281c 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            position: relative;
            width: 500px;
            height: 500px;
            background: linear-gradient(145deg, #f3e5c8, #dfcbab);
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            overflow: hidden;
        }

        /* ===== ВЕРХНИЙ ТЕКСТ (без символов) ===== */
        .header-text {
            font-size: 14px;
            color: #8c7152;
            font-weight: 300;
            margin-bottom: 15px;
            letter-spacing: 2px;
            opacity: 0.4;
            user-select: none;
        }

        /* ===== ЛЕВАЯ ПАНЕЛЬ ===== */
        .left-panel {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 120px;
        }

        .btn-pill {
            width: 70px;
            height: 30px;
            background: #edd8b5;
            border-radius: 15px;
            box-shadow: inset 2px 2px 5px rgba(255, 255, 255, 0.5),
                        inset -2px -2px 5px rgba(0, 0, 0, 0.1);
        }

        .toggle-vert {
            width: 45px;
            height: 90px;
            background: #edd8b5;
            border-radius: 25px;
            position: relative;
            box-shadow: inset 3px 3px 6px rgba(0, 0, 0, 0.15),
                        inset -3px -3px 6px rgba(255, 255, 255, 0.6);
        }

        .toggle-thumb {
            position: absolute;
            bottom: 5px;
            left: 5px;
            width: 35px;
            height: 35px;
            background: linear-gradient(145deg, #f5e4c3, #d4be9b);
            border-radius: 50%;
            box-shadow: 3px 3px 6px rgba(0, 0, 0, 0.2);
        }

        /* ===== СТЕКЛЯННОЕ ОКНО ===== */
        .glass-window {
            position: absolute;
            top: 60px;
            left: 140px;
            width: 330px;
            height: 380px;
            background: rgba(245, 235, 215, 0.45);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
        }

        /* ===== ВЕРХНЯЯ ПАНЕЛЬ ===== */
        .top-toolbar {
            display: flex;
            gap: 8px;
            background: rgba(255, 255, 255, 0.3);
            padding: 6px;
            border-radius: 12px;
        }

        .tool-btn {
            height: 28px;
            background: #ebd8b5;
            border-radius: 8px;
            border: none;
            box-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .tool-btn.small { width: 28px; }
        .tool-btn.medium { width: 45px; }
        .tool-btn.large {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #8c7152;
            font-size: 18px;
            font-weight: 300;
        }

        /* ===== ЦЕНТРАЛЬНАЯ ЗВЕЗДА ✦ ===== */
        .star-display {
            height: 110px;
            background: linear-gradient(135deg, #593922, #3d2414);
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .star {
            color: #edd8b5;
            font-size: 48px;
            text-shadow: 0 0 30px rgba(237, 216, 181, 0.15);
            font-weight: 300;
            letter-spacing: 2px;
        }

        /* ===== СЛАЙДЕРЫ ===== */
        .slider-row {
            height: 45px;
            background: rgba(255, 248, 235, 0.7);
            border-radius: 22px;
            display: flex;
            align-items: center;
            padding: 0 10px;
            position: relative;
            box-shadow: inset 2px 2px 5px rgba(0, 0, 0, 0.05);
        }

        .slider-thumb {
            width: 60px;
            height: 30px;
            background: #d4be9b;
            border-radius: 15px;
            box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.15);
        }

        .slider-thumb.left { margin-left: 40px; }
        .slider-thumb.right { width: 80px; }

        .slider-row .icon-btn {
            width: 32px;
            height: 32px;
            border-radius: 12px;
            background: #c5ad8c;
            border: none;
            box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.1);
        }

        .slider-row .icon-btn.light {
            background: #ebd8b5;
        }

        /* ===== НИЖНИЕ КНОПКИ ===== */
        .bottom-icons {
            position: absolute;
            bottom: 15px;
            right: 20px;
            display: flex;
            gap: 10px;
        }

        .icon-btn-round {
            width: 32px;
            height: 32px;
            background: #ebd8b5;
            border-radius: 50%;
            border: none;
            box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.15);
            cursor: pointer;
            color: #8c7152;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ===== ПОДПИСЬ SQST (мелко, снизу слева) ===== */
        .sqst-signature {
            position: absolute;
            bottom: 12px;
            left: 24px;
            font-size: 9px;
            letter-spacing: 4px;
            color: rgba(140, 113, 82, 0.1);
            text-transform: uppercase;
            user-select: none;
            font-weight: 300;
        }

        /* ===== АДАПТАЦИЯ ===== */
        @media (max-width: 540px) {
            .container {
                transform: scale(0.9);
            }
        }
        @media (max-width: 480px) {
            .container {
                transform: scale(0.75);
            }
        }
        @media (max-width: 400px) {
            .container {
                transform: scale(0.6);
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- Верхний текст (без символов) -->
        <div class="header-text">#art</div>

        <!-- Левая панель -->
        <div class="left-panel">
            <div class="btn-pill"></div>
            <div class="toggle-vert">
                <div class="toggle-thumb"></div>
            </div>
        </div>

        <!-- Стеклянное окно -->
        <div class="glass-window">

            <!-- Верхняя панель -->
            <div class="top-toolbar">
                <div class="tool-btn small"></div>
                <div class="tool-btn medium"></div>
                <div class="tool-btn medium"></div>
                <div class="tool-btn large">+</div>
            </div>

            <!-- Звезда — единственный символ ✦ -->
            <div class="star-display">
                <div class="star">✦</div>
            </div>

            <!-- Слайдер 1 -->
            <div class="slider-row">
                <div class="slider-thumb left"></div>
            </div>

            <!-- Слайдер 2 -->
            <div class="slider-row" style="justify-content: space-between;">
                <div class="icon-btn"></div>
                <div class="slider-thumb right"></div>
                <div class="icon-btn light"></div>
            </div>

        </div>

        <!-- Нижние кнопки -->
        <div class="bottom-icons">
            <button class="icon-btn-round">◯</button>
            <button class="icon-btn-round">◯</button>
        </div>

        <!-- Подпись SQST -->
        <div class="sqst-signature">SQST ✦</div>

    </div>

</body>
</html>
