<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SQST ✦ Фон — волны</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 1920px;
            height: 1080px;
            overflow: hidden;
            background: #0e0c0a;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            font-family: 'Segoe UI', sans-serif;
        }

        /* ===== КОНТЕЙНЕР С ВОЛНАМИ ===== */
        .waves-container {
            position: absolute;
            inset: 0;
            z-index: 0;
            overflow: hidden;
        }

        .waves-container svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* ===== ТЕНИ ПО БОКАМ ===== */
        .shadow-left {
            position: absolute;
            top: 0;
            left: 0;
            width: 30%;
            height: 100%;
            background: linear-gradient(to right, rgba(14, 12, 10, 0.6) 0%, transparent 100%);
            z-index: 1;
            pointer-events: none;
        }

        .shadow-right {
            position: absolute;
            top: 0;
            right: 0;
            width: 30%;
            height: 100%;
            background: linear-gradient(to left, rgba(14, 12, 10, 0.6) 0%, transparent 100%);
            z-index: 1;
            pointer-events: none;
        }

        /* ===== СВЕТЛАЯ ОБЛАСТЬ В ЦЕНТРЕ ===== */
        .center-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 45%;
            height: 55%;
            background: radial-gradient(ellipse at center, #b68c4a 0%, #a46e37 30%, transparent 70%);
            filter: blur(60px);
            z-index: 0;
            pointer-events: none;
            opacity: 0.7;
        }

        /* ===== ВЕРХНИЙ ТЕКСТ (как на картинке) ===== */
        .top-text {
            position: absolute;
            top: 40px;
            left: 50px;
            z-index: 2;
            color: rgba(255, 255, 255, 0.04);
            font-size: 14px;
            letter-spacing: 4px;
            font-weight: 300;
            text-transform: uppercase;
            font-family: 'Courier New', monospace;
            user-select: none;
        }

        /* ===== ПОДПИСЬ SQST ===== */
        .signature {
            position: absolute;
            bottom: 30px;
            right: 40px;
            z-index: 2;
            font-family: 'Georgia', serif;
            color: rgba(206, 170, 115, 0.04);
            font-size: 10px;
            letter-spacing: 5px;
            text-transform: uppercase;
            user-select: none;
        }

        /* ===== АДАПТАЦИЯ ===== */
        @media (max-width: 1920px) {
            body {
                width: 100vw;
                height: 100vh;
            }
        }
    </style>
</head>
<body>

    <!-- ===== ВОЛНЫ (SVG) ===== -->
    <div class="waves-container">
        <svg viewBox="0 0 1920 1080" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#0e0c0a" />
                    <stop offset="15%" stop-color="#343434" />
                    <stop offset="30%" stop-color="#50392b" />
                    <stop offset="45%" stop-color="#74563c" />
                    <stop offset="55%" stop-color="#b68c4a" />
                    <stop offset="65%" stop-color="#a46e37" />
                    <stop offset="80%" stop-color="#4d2714" />
                    <stop offset="90%" stop-color="#343434" />
                    <stop offset="100%" stop-color="#0e0c0a" />
                </linearGradient>

                <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#0e0c0a" />
                    <stop offset="20%" stop-color="#50392b" />
                    <stop offset="40%" stop-color="#b68c4a" />
                    <stop offset="60%" stop-color="#a46e37" />
                    <stop offset="80%" stop-color="#4d2714" />
                    <stop offset="100%" stop-color="#0e0c0a" />
                </linearGradient>
            </defs>

            <!-- Фон -->
            <rect width="1920" height="1080" fill="url(#grad1)" />

            <!-- Волна 1 — верхняя -->
            <path d="
                M 0 200
                C 300 80, 500 350, 800 180
                C 1100 10, 1300 300, 1600 150
                C 1800 70, 1900 200, 1920 220
                L 1920 0
                L 0 0
                Z
            " fill="#743e1a" opacity="0.15" />

            <!-- Волна 2 — основная, через центр -->
            <path d="
                M 0 400
                C 200 250, 400 550, 700 380
                C 1000 210, 1200 500, 1500 350
                C 1700 260, 1850 400, 1920 450
                L 1920 1080
                L 0 1080
                Z
            " fill="url(#grad2)" opacity="0.4" />

            <!-- Волна 3 — нижняя -->
            <path d="
                M 0 650
                C 300 500, 500 750, 800 600
                C 1100 450, 1300 700, 1600 580
                C 1800 500, 1900 620, 1920 650
                L 1920 1080
                L 0 1080
                Z
            " fill="#74563c" opacity="0.2" />

            <!-- Волна 4 — светлая полоса -->
            <path d="
                M 0 500
                C 200 420, 400 580, 700 480
                C 1000 380, 1200 550, 1500 460
                C 1700 400, 1850 480, 1920 520
                L 1920 650
                L 0 650
                Z
            " fill="#b68c4a" opacity="0.08" />

            <!-- Волна 5 — диагональная тень слева -->
            <path d="
                M 0 0
                C 300 200, 400 400, 350 600
                C 300 800, 200 900, 0 1080
                L 0 0
                Z
            " fill="#0e0c0a" opacity="0.3" />

            <!-- Волна 6 — диагональная тень справа -->
            <path d="
                M 1920 0
                C 1600 200, 1500 400, 1550 600
                C 1600 800, 1700 900, 1920 1080
                L 1920 0
                Z
            " fill="#0e0c0a" opacity="0.3" />

            <!-- Волна 7 — тёмная нижняя -->
            <path d="
                M 0 800
                C 400 700, 800 900, 1200 800
                C 1600 700, 1800 850, 1920 800
                L 1920 1080
                L 0 1080
                Z
            " fill="#4d2714" opacity="0.15" />

            <!-- Волна 8 — мелкая деталь -->
            <path d="
                M 0 300
                C 200 280, 350 340, 500 300
                C 700 250, 850 320, 1000 280
                C 1200 230, 1400 310, 1600 270
                C 1800 230, 1900 290, 1920 280
            " stroke="#b68c4a" stroke-width="1.5" fill="none" opacity="0.08" />
        </svg>
    </div>

    <!-- ===== СВЕТЛАЯ ОБЛАСТЬ В ЦЕНТРЕ ===== -->
    <div class="center-glow"></div>

    <!-- ===== ТЕНИ ПО БОКАМ ===== -->
    <div class="shadow-left"></div>
    <div class="shadow-right"></div>

    <!-- ===== ВЕРХНИЙ ТЕКСТ ===== -->
    <div class="top-text">✦ interface</div>

    <!-- ===== ПОДПИСЬ ===== -->
    <div class="signature">SQST ✦</div>

</body>
</html>
