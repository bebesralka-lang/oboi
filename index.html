<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SQST ✦ UI-концепт — матовое стекло</title>
    <style>
        /* ========== СБРОС ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 1920px;
            height: 1080px;
            overflow: hidden;
            background: #1a100e;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', -apple-system, sans-serif;
            position: relative;
        }

        /* ========== ФОН: ГЛУБОКИЙ ГРАДИЕНТ С БОКЕ ========== */
        .bg {
            position: absolute;
            inset: 0;
            z-index: 0;
            background:
                radial-gradient(ellipse at 25% 30%, #804a23 0%, transparent 55%),
                radial-gradient(ellipse at 75% 70%, #54444c 0%, transparent 50%),
                radial-gradient(ellipse at 50% 100%, #1f140e 0%, transparent 60%),
                #1a100e;
            filter: blur(2px);
        }

        /* ===== РАЗМЫТЫЕ ПЯТНА БОКЕ ===== */
        .bokeh {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            filter: blur(150px);
        }
        .bokeh:nth-child(2) { top: -15%; right: -10%; width: 60%; height: 60%; background: radial-gradient(circle, rgba(206, 170, 115, 0.06) 0%, transparent 70%); }
        .bokeh:nth-child(3) { bottom: -10%; left: -10%; width: 55%; height: 55%; background: radial-gradient(circle, rgba(190, 152, 100, 0.05) 0%, transparent 70%); }
        .bokeh:nth-child(4) { top: 40%; left: 35%; width: 40%; height: 40%; background: radial-gradient(circle, rgba(171, 120, 64, 0.03) 0%, transparent 70%); }
        .bokeh:nth-child(5) { bottom: 30%; right: 20%; width: 30%; height: 30%; background: radial-gradient(circle, rgba(206, 170, 115, 0.04) 0%, transparent 70%); }

        /* ========== ВИНЬЕТКА ========== */
        .vignette {
            position: absolute;
            inset: 0;
            z-index: 0;
            background: radial-gradient(ellipse at center, transparent 50%, rgba(0, 0, 0, 0.15) 100%);
            pointer-events: none;
        }

        /* ========== КОНТЕЙНЕР С ПАНЕЛЯМИ ========== */
        .interface {
            position: relative;
            z-index: 1;
            display: flex;
            flex-wrap: wrap;
            gap: 28px;
            max-width: 940px;
            justify-content: center;
            align-items: flex-start;
            padding: 20px;
            perspective: 1200px;
        }

        /* ===== ПАНЕЛИ С МАТОВЫМ СТЕКЛОМ ===== */
        .glass-panel {
            background: rgba(255, 248, 240, 0.04);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border-radius: 34px;
            border: 1px solid rgba(255, 248, 240, 0.03);
            box-shadow:
                0 30px 100px rgba(0, 0, 0, 0.5),
                0 0 0 1px rgba(255, 248, 240, 0.01) inset,
                0 0 40px rgba(206, 170, 115, 0.02) inset;
            padding: 28px 32px 32px;
            flex: 1 1 240px;
            min-width: 200px;
            transform: rotateY(-2deg) rotateX(2deg);
            transition: none;
        }

        .glass-panel:nth-child(1) { transform: translateY(-5px) rotateY(-3deg) rotateX(1deg); }
        .glass-panel:nth-child(2) { transform: translateY(15px) rotateY(1deg) rotateX(-2deg); }
        .glass-panel:nth-child(3) { transform: translateY(-10px) rotateY(4deg) rotateX(2deg); }

        .glass-panel .label {
            font-size: 10px;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: rgba(206, 170, 115, 0.12);
            margin-bottom: 18px;
            font-weight: 400;
        }

        .glass-panel .label .accent {
            color: rgba(206, 170, 115, 0.2);
        }

        /* ===== СЛАЙДЕРЫ ===== */
        .slider-group {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .slider-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .slider-row .name {
            font-size: 11px;
            color: rgba(255, 248, 240, 0.08);
            font-weight: 300;
            min-width: 48px;
            letter-spacing: 0.5px;
        }

        .slider-track {
            flex: 1;
            height: 3px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.03);
            position: relative;
            box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.2);
        }

        .slider-track .fill {
            height: 100%;
            border-radius: 10px;
            background: linear-gradient(90deg, rgba(206, 170, 115, 0.15), rgba(206, 170, 115, 0.3));
            width: 65%;
        }

        .slider-track .thumb {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: radial-gradient(circle at 40% 35%, #f5e6bc, #ceaa73);
            position: absolute;
            top: 50%;
            left: 65%;
            transform: translate(-50%, -50%);
            box-shadow:
                0 2px 12px rgba(206, 170, 115, 0.08),
                0 4px 20px rgba(0, 0, 0, 0.15);
        }

        .slider-row .value {
            font-size: 11px;
            color: rgba(206, 170, 115, 0.15);
            min-width: 28px;
            text-align: right;
            font-weight: 300;
        }

        /* ===== ПЕРЕКЛЮЧАТЕЛИ ===== */
        .toggle-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 2px;
        }

        .toggle-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .toggle-track {
            width: 38px;
            height: 20px;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.02);
            position: relative;
            box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.2);
        }

        .toggle-track .thumb {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: radial-gradient(circle at 40% 35%, #f5e6bc, #ceaa73);
            position: absolute;
            top: 2px;
            left: 2px;
            box-shadow: 0 2px 12px rgba(206, 170, 115, 0.05), 0 2px 8px rgba(0, 0, 0, 0.1);
            transition: none;
        }

        .toggle-track.active .thumb {
            left: 20px;
        }

        .toggle-row .name {
            font-size: 11px;
            color: rgba(255, 248, 240, 0.08);
            font-weight: 300;
            letter-spacing: 0.5px;
        }

        /* ===== ИКОНКИ ===== */
        .icon-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-top: 4px;
        }

        .icon-btn {
            aspect-ratio: 1 / 1;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.01);
            border: 1px solid rgba(255, 255, 255, 0.02);
            color: rgba(255, 255, 255, 0.06);
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', sans-serif;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            transition: none;
        }

        .icon-btn .gold {
            color: rgba(206, 170, 115, 0.08);
        }

        /* ===== ДЕКОРАТИВНЫЙ ТЕКСТ ===== */
        .futuristic-text {
            position: absolute;
            font-family: 'Courier New', monospace;
            letter-spacing: 2px;
            color: rgba(255, 255, 255, 0.02);
            pointer-events: none;
            z-index: 0;
            font-weight: 300;
        }

        .futuristic-text:nth-child(6) { top: 50px; left: 40px; font-size: 14px; color: rgba(255, 255, 255, 0.015); }
        .futuristic-text:nth-child(7) { top: 80px; left: 40px; font-size: 22px; color: rgba(255, 255, 255, 0.01); letter-spacing: 6px; font-weight: 400; }
        .futuristic-text:nth-child(8) { bottom: 100px; left: 50px; font-size: 10px; color: rgba(255, 255, 255, 0.01); }
        .futuristic-text:nth-child(9) { bottom: 80px; left: 50px; font-size: 14px; color: rgba(255, 255, 255, 0.008); letter-spacing: 4px; }
        .futuristic-text:nth-child(10) { top: 35px; right: 45px; font-size: 12px; color: rgba(255, 255, 255, 0.015); text-align: right; }
        .futuristic-text:nth-child(11) { bottom: 160px; right: 45px; font-size: 9px; color: rgba(255, 255, 255, 0.008); text-align: right; }

        /* ===== ГЛЯНЦЕВЫЙ БЛИК ===== */
        .glare {
            position: absolute;
            top: -15%;
            left: -20%;
            width: 80%;
            height: 80%;
            background: radial-gradient(ellipse at 20% 20%, rgba(255, 255, 255, 0.02) 0%, transparent 60%);
            pointer-events: none;
            z-index: 0;
            transform: rotate(-15deg);
        }

        /* ===== ПОДПИСЬ ===== */
        .signature {
            position: absolute;
            bottom: 30px;
            right: 40px;
            z-index: 2;
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: 'Georgia', serif;
        }

        .signature .symbol {
            font-size: 36px;
            color: rgba(206, 170, 115, 0.06);
            text-shadow: 0 0 40px rgba(206, 170, 115, 0.02);
            font-weight: 400;
        }

        .signature .text {
            font-size: 10px;
            letter-spacing: 5px;
            color: rgba(206, 170, 115, 0.02);
            text-transform: uppercase;
            font-weight: 300;
        }

        /* ========== АДАПТАЦИЯ ========== */
        @media (max-width: 1920px) {
            body {
                width: 100vw;
                height: 100vh;
            }
        }

        @media (max-width: 768px) {
            .interface {
                padding: 10px;
                gap: 16px;
                max-width: 100%;
            }
            .glass-panel {
                padding: 18px 16px 20px;
                min-width: 140px;
                flex: 1 1 160px;
                border-radius: 24px;
                transform: none !important;
            }
            .glass-panel .label {
                font-size: 8px;
                letter-spacing: 2px;
            }
            .slider-row .name { font-size: 9px; min-width: 36px; }
            .slider-row .value { font-size: 9px; min-width: 20px; }
            .toggle-row .name { font-size: 9px; }
            .icon-btn { font-size: 13px; border-radius: 12px; }
            .futuristic-text { display: none; }
            .signature .symbol { font-size: 24px; }
            .signature .text { font-size: 8px; letter-spacing: 3px; }
            .signature { bottom: 16px; right: 16px; }
        }
    </style>
</head>
<body>

    <!-- ===== ФОН ===== -->
    <div class="bg"></div>
    <div class="bokeh"></div>
    <div class="bokeh"></div>
    <div class="bokeh"></div>
    <div class="bokeh"></div>
    <div class="vignette"></div>
    <div class="glare"></div>

    <!-- ===== ДЕКОРАТИВНЫЙ ТЕКСТ ===== -->
    <div class="futuristic-text">OMGGso</div>
    <div class="futuristic-text">#arTYh)</div>
    <div class="futuristic-text">CVI xaa TOR43()</div>
    <div class="futuristic-text">✦ interface v.2</div>
    <div class="futuristic-text">SQST // design</div>
    <div class="futuristic-text">neo.morphism // 2026</div>

    <!-- ===== ПАНЕЛИ ===== -->
    <div class="interface">

        <!-- ===== ПАНЕЛЬ 1: СЛАЙДЕРЫ ===== -->
        <div class="glass-panel">
            <div class="label">✦ <span class="accent">контроль</span></div>
            <div class="slider-group">
                <div class="slider-row">
                    <span class="name">яркость</span>
                    <div class="slider-track">
                        <div class="fill" style="width:65%;"></div>
                        <div class="thumb" style="left:65%;"></div>
                    </div>
                    <span class="value">65</span>
                </div>
                <div class="slider-row">
                    <span class="name">контраст</span>
                    <div class="slider-track">
                        <div class="fill" style="width:42%;"></div>
                        <div class="thumb" style="left:42%;"></div>
                    </div>
                    <span class="value">42</span>
                </div>
                <div class="slider-row">
                    <span class="name">свечение</span>
                    <div class="slider-track">
                        <div class="fill" style="width:80%;"></div>
                        <div class="thumb" style="left:80%;"></div>
                    </div>
                    <span class="value">80</span>
                </div>
            </div>
        </div>

        <!-- ===== ПАНЕЛЬ 2: ПЕРЕКЛЮЧАТЕЛИ ===== -->
        <div class="glass-panel">
            <div class="label">✦ <span class="accent">режимы</span></div>
            <div class="toggle-group">
                <div class="toggle-row">
                    <div class="toggle-track active"><div class="thumb" style="left:20px;"></div></div>
                    <span class="name">неон</span>
                </div>
                <div class="toggle-row">
                    <div class="toggle-track"><div class="thumb"></div></div>
                    <span class="name">гравировка</span>
                </div>
                <div class="toggle-row">
                    <div class="toggle-track active"><div class="thumb" style="left:20px;"></div></div>
                    <span class="name">мат. стекло</span>
                </div>
            </div>
        </div>

        <!-- ===== ПАНЕЛЬ 3: ИКОНКИ ===== -->
        <div class="glass-panel">
            <div class="label">✦ <span class="accent">инструменты</span></div>
            <div class="icon-grid">
                <div class="icon-btn"><span class="gold">✦</span></div>
                <div class="icon-btn"><span class="gold">✧</span></div>
                <div class="icon-btn"><span class="gold">⌘</span></div>
                <div class="icon-btn"><span class="gold">⚙</span></div>
                <div class="icon-btn"><span class="gold">✚</span></div>
                <div class="icon-btn"><span class="gold">◈</span></div>
                <div class="icon-btn"><span class="gold">⌂</span></div>
                <div class="icon-btn"><span class="gold">✦</span></div>
            </div>
            <div style="display:flex; gap:8px; margin-top:10px;">
                <div class="icon-btn" style="flex:1; justify-content:center; gap:6px; font-size:11px; color:rgba(206,170,115,0.05); border-radius:16px; padding:8px 0; aspect-ratio:auto;">
                    <span class="gold">✦</span> применить
                </div>
                <div class="icon-btn" style="flex:1; justify-content:center; gap:6px; font-size:11px; color:rgba(255,255,255,0.02); border-radius:16px; padding:8px 0; aspect-ratio:auto;">
                    <span>✧</span> сброс
                </div>
            </div>
        </div>

    </div>

    <!-- ===== ПОДПИСЬ ===== -->
    <div class="signature">
        <span class="text">SQST</span>
        <span class="symbol">✦</span>
    </div>

</body>
</html>
